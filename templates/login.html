{% extends "base.html" %}
{% block title %}Вход - TutorPro{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="content-card">
            <div class="text-center mb-4">
                <h2 class="gradient-text fw-bold mb-2">🔐 Вход в систему</h2>
                <p class="text-muted">TutorPro - ваш путь к знаниям</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">👤 Логин</label>
                    <input type="text" name="username" class="form-control" required placeholder="Введите ваш логин">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">🔑 Пароль</label>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3">Войти</button>
            </form>
            <div class="text-center mt-4">
                <p class="text-muted mb-0">Нет аккаунта? <a href="/register" class="text-decoration-none">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
